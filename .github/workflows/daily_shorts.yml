name: Daily AI Shorts Generator

on:
  schedule:
    # 04:15 UTC = 11:15 AM Bangkok Time (Off-peak minute to prevent GitHub dropping)
    - cron: '15 4 * * *'
    # 12:15 UTC = 19:15 PM Bangkok Time (Off-peak minute to prevent GitHub dropping)
    - cron: '15 12 * * *'
  push:
    paths:
      - 'trigger_run.txt'
  workflow_dispatch:
    inputs:
      tool:
        description: 'Specific AI Tool to review (leave blank for auto-pick)'
        required: false
        default: ''

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and Publish AI Short Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_BIO_URL: ${{ secrets.AFFILIATE_BIO_URL }}
        run: |
          python run_local.py "${{ github.event.inputs.tool }}"

      - name: Save Video & Metadata as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 30
